<!doctype html>
<html lang="ar" dir="rtl" class="dark" style="color-scheme: dark; background-color: #0e1217;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>المصحف الإلكتروني الشريف - القارئ التفاعلي</title>
    <meta name="description" content="المصحف الإلكتروني التفاعلي للقرآن الكريم بتصميم يحاكي المصحف الشريف الحقيقي مع التلاوة الصوتية والتفاسير وفهرس السور والأجزاء." />
    
    <!-- Google Fonts for Authentic Arabic & Quranic Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Amiri:ital,wght@0,400;0,700;1,400&family=Cairo:wght@400;600;700;800&family=Scheherazade+New:wght@400;600;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- Instant Dark Mode Initialization (Zero FOUC) -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('mushaf_theme');
          // Default to 'dark' mode unless user explicitly selected something else
          if (!savedTheme || savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
            if (!savedTheme) {
              localStorage.setItem('mushaf_theme', 'dark');
            }
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
    
    <!-- PWA & Mobile Web App Capabilities -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#1e4d2b" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#15341d" media="(prefers-color-scheme: dark)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="المصحف الشريف" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="application-name" content="المصحف الشريف" />
    <meta name="msapplication-TileColor" content="#1e4d2b" />
    <meta name="msapplication-tap-highlight" content="no" />
    
    <!-- Apple Touch Icons & Standard Favicons -->
    <link rel="shortcut icon" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
  </head>
  <body class="bg-[#12161a] text-slate-100 font-sans antialiased overflow-x-hidden selection:bg-amber-700/30 selection:text-amber-200">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
