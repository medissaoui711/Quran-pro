<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15341d"/>
      <stop offset="50%" stop-color="#1e4d2b"/>
      <stop offset="100%" stop-color="#0f2615"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fdf0cd"/>
      <stop offset="40%" stop-color="#e9d19a"/>
      <stop offset="70%" stop-color="#c5a059"/>
      <stop offset="100%" stop-color="#8b6e31"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded rectangle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Islamic Geometric Border -->
  <rect x="24" y="24" width="464" height="464" rx="92" fill="none" stroke="url(#goldGrad)" stroke-width="5" stroke-dasharray="14 6"/>
  <rect x="36" y="36" width="440" height="440" rx="80" fill="none" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Decorative Corner Arabesque Accents -->
  <circle cx="70" cy="70" r="10" fill="url(#goldGrad)"/>
  <circle cx="442" cy="70" r="10" fill="url(#goldGrad)"/>
  <circle cx="70" cy="442" r="10" fill="url(#goldGrad)"/>
  <circle cx="442" cy="442" r="10" fill="url(#goldGrad)"/>

  <!-- Center Medallion / Quran Frame -->
  <g transform="translate(256, 256)">
    <!-- Octagram Star / Islamic Star Behind -->
    <path d="M 0 -150 L 44 -106 L 106 -106 L 106 -44 L 150 0 L 106 44 L 106 106 L 44 106 L 0 150 L -44 106 L -106 106 L -106 44 L -150 0 L -106 -44 L -106 -106 L -44 -106 Z" fill="#15341d" stroke="url(#goldGrad)" stroke-width="4" filter="url(#glow)"/>
    
    <!-- Central Dome & Mushaf Book Silhouette -->
    <!-- Open Book Pages -->
    <path d="M 0 -20 C -40 -60, -90 -60, -110 -30 C -110 30, -110 70, -110 70 C -90 40, -40 40, 0 70 C 40 40, 90 40, 110 70 C 110 70, 110 30, 110 -30 C 90 -60, 40 -60, 0 -20 Z" fill="url(#goldGrad)"/>
    
    <!-- Inner Book Binding Line -->
    <path d="M 0 -20 L 0 70" stroke="#15341d" stroke-width="4"/>
    <path d="M -80 -10 C -50 -10, -20 0, 0 15" fill="none" stroke="#15341d" stroke-width="3" stroke-linecap="round"/>
    <path d="M -80 15 C -50 15, -20 25, 0 40" fill="none" stroke="#15341d" stroke-width="3" stroke-linecap="round"/>
    <path d="M 80 -10 C 50 -10, 20 0, 0 15" fill="none" stroke="#15341d" stroke-width="3" stroke-linecap="round"/>
    <path d="M 80 15 C 50 15, 20 25, 0 40" fill="none" stroke="#15341d" stroke-width="3" stroke-linecap="round"/>

    <!-- Crescent and Star on Top -->
    <path d="M -15 -85 A 25 25 0 0 0 15 -60 A 20 20 0 0 1 -10 -80 Z" fill="url(#goldGrad)"/>
    <polygon points="12,-85 15,-77 23,-77 17,-72 19,-64 12,-69 5,-64 7,-72 1,-77 9,-77" fill="url(#goldGrad)"/>
  </g>

  <!-- Typography at bottom -->
  <text x="256" y="420" font-family="'Amiri', serif" font-size="34" font-weight="bold" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">المصحف الشريف</text>
</svg>
